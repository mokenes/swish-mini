
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swish Mini Demo</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f2f6f3;
  color: #17251c;
}
header {
  background: #32b86a;
  color: white;
  padding: 24px;
  font-size: 27px;
  font-weight: bold;
}
main {
  max-width: 430px;
  margin: 25px auto;
  padding: 20px;
}
.card {
  background: white;
  padding: 24px;
  border-radius: 20px;
  box-shadow: 0 4px 18px #0000000c;
  margin-bottom: 18px;
}
small { color: #66736a; }
.balance {
  font-size: 34px;
  color: #25a65b;
  font-weight: bold;
  margin: 12px 0;
}
input, button {
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  border-radius: 12px;
  font-size: 16px;
}
input { border: 1px solid #ccd5ce; }
button {
  border: none;
  background: #32b86a;
  color: white;
  font-weight: bold;
  cursor: pointer;
}
#history p {
  padding: 12px 0;
  border-bottom: 1px solid #eee;
}
footer {
  text-align: center;
  color: #66736a;
  font-size: 12px;
  padding: 20px;
}
</style>
</head>
<body>
<header>● Swish Mini</header>

<main>
  <section class="card">
    <small>DEMO BALANCE</small>
    <div class="balance" id="balance">1 000,00 kr</div>
    <small>Simulated money — not real funds</small>
  </section>

  <section class="card">
    <h2>Send a demo payment</h2>
    <form id="payment">
      <input id="name" placeholder="Recipient name" required>
      <input id="amount" type="number"
        placeholder="Amount in SEK" min="1"
        max="1000" step="1" required>
      <button type="submit">Send demo payment</button>
    </form>
    <p id="message" role="status"></p>
  </section>

  <section class="card">
    <h3>Recent activity</h3>
    <div id="history"><small>No payments yet</small></div>
  </section>
</main>

<footer>
  Unofficial demo · No real money is sent
</footer>

<script>
let balance = 1000;
const history = document.getElementById("history");

document.getElementById("payment")
.addEventListener("submit", function(event) {
  event.preventDefault();

  const name = document.getElementById("name").value.trim();
  const amount = Number(document.getElementById("amount").value);
  const message = document.getElementById("message");

  if (!name || !Number.isInteger(amount) ||
      amount < 1 || amount > balance) {
    message.textContent = "Enter a valid amount within your demo balance.";
    return;
  }

  balance -= amount;
  document.getElementById("balance").textContent =
    balance.toLocaleString("sv-SE", {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    }) + " kr";

  if (history.querySelector("small")) history.innerHTML = "";

  const entry = document.createElement("p");
  entry.textContent = name + " — " + amount + " kr (DEMO)";
  history.prepend(entry);

  message.textContent = "Demo payment completed!";
  this.reset();
});
</script>
</body>
</html>
