
<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swish Mini Demo</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: #080a09;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  padding: 20px 24px;
  color: #36d984;
  font-size: 28px;
  font-weight: bold;
}

main {
  width: min(450px, calc(100% - 32px));
  margin: 70px auto 30px;
}

.card {
  background: #141716;
  border: 1px solid #292e2b;
  border-radius: 22px;
  padding: 32px 24px;
  text-align: center;
}

h1 {
  font-size: 25px;
  margin: 0 0 24px;
}

.message {
  font-size: 18px;
  line-height: 1.6;
  color: #e0e5e1;
}

.demo {
  margin-top: 25px;
  color: #a5afa8;
  font-size: 12px;
}

button {
  width: 100%;
  margin-top: 24px;
  padding: 17px;
  background: #202820;
  color: white;
  border: 1px solid #292e2b;
  border-radius: 15px;
  font-size: 17px;
  cursor: pointer;
}

button:hover {
  background: #2b382d;
}
</style>
</head>
<body>
<header>● Swish Mini</header>

<main>
  <section class="card">
    <h1>Information</h1>

    <p class="message">
      Pengarna kommer inom en viss tid.
      Det kan ta längre tid.
    </p>

    <p class="demo">
      DEMO — Ingen riktig betalning har gjorts.
    </p>
  </section>

  <button onclick="location.href='index.html'">
    ← Tillbaka
  </button>
</main>
</body>
</html>
