
<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swish – Demo</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #080a09;
  color: white;
}

header {
  padding: 24px;
  font-size: 25px;
  font-weight: bold;
  color: #36d984;
}

main {
  max-width: 450px;
  margin: 35px auto;
  padding: 20px;
}

.card {
  background: #141716;
  border: 1px solid #292e2b;
  border-radius: 20px;
  padding: 25px;
  text-align: center;
}

h1 {
  font-size: 25px;
  margin-bottom: 20px;
}

.message {
  color: #d0d7d2;
  font-size: 17px;
  line-height: 1.6;
}

.demo {
  margin-top: 25px;
  font-size: 12px;
  color: #a5afa8;
}

button {
  width: 100%;
  margin-top: 25px;
  padding: 16px;
  border: 0;
  border-radius: 14px;
  background: #202820;
  color: white;
  font-size: 17px;
  cursor: pointer;
}
</style>
</head>

<body>
<header>Swish</header>

<main>
  <section class="card">
    <h1>Information</h1>

    <p class="message">
      Pengarna kommer inom en viss tid.
      Det kan ta längre tid.
    </p>

    <p class="demo">
      DEMO – Sweden certifierad
    </p>
  </section>

  <button onclick="location.href='index.html'">
    ← Tillbaka
  </button>
</main>
</body>
</html>
